name: Build

on:
  push:
    branches: [ "ml_dev2" ]
  pull_request:
    branches: [ "ml_dev2" ]
  workflow_dispatch:
  
jobs:
  build:
    name: Build XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Prepare
        run: |
          FPATH="./mft $(date +'%Y-%m-%d %H-%M-%S')"
          echo $FPATH | cat >FPATH
          echo Using build path: $FPATH
          mkdir "$FPATH"
          
      - name: Build for iOS
        env:
          FPATH: ${{ 'FPATH' }}
        run: |
          if [ $FPATH = FPATH ]; then FPATH=$(cat FPATH); fi
          xcodebuild archive  -scheme "mft ios" -destination "generic/platform=iOS" -archivePath "${FPATH}/mft_ios"  SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES   
      
      - name: Build for iOS Simulator
        env:
          FPATH: ${{ 'FPATH' }}
        run: |
          if [ $FPATH = FPATH ]; then FPATH=$(cat FPATH); fi
          xcodebuild archive  -scheme "mft ios" -destination "generic/platform=iOS Simulator" -archivePath "${FPATH}/mft_sim"  SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES  
      
      - name: Build for macOS
        env:
          FPATH: ${{ 'FPATH' }}
        run: |
          if [ $FPATH = FPATH ]; then FPATH=$(cat FPATH); fi
          xcodebuild archive  -scheme "mft" -destination "generic/platform=macOS" -archivePath "${FPATH}/mft_macos"  SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          
      - name: Build for macOS
        env:
          FPATH: ${{ 'FPATH' }}
        run: |
          if [ $FPATH = FPATH ]; then FPATH=$(cat FPATH); fi
          xcodebuild -create-xcframework -framework "${FPATH}/mft_ios.xcarchive/Products/Library/Frameworks/mft.framework" -framework "${FPATH}/mft_sim.xcarchive/Products/Library/Frameworks/mft.framework" -framework "${FPATH}/mft_macos.xcarchive/Products/Library/Frameworks/mft.framework" -output "${FPATH}/mft.xcframework"
          
