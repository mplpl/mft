name: Build

on:
  push:
    branches: [ "ml_dev2" ]
  pull_request:
    branches: [ "ml_dev2" ]
  workflow_dispatch:
  
jobs:
  build:
    name: Build for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild archive  -scheme "mft" -destination "generic/platform=macOS" -archivePath "${FPATH}/mft_macos"  SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES 
